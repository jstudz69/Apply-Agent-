[project]
name = "apply-agent"
version = "0.1.0"
description = "Supervised Workday application copilot: deterministic Playwright driver, answer bank, human submit gate."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "playwright>=1.49",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
    "keyring>=25",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]
dev = ["pytest>=8"]

[project.scripts]
apply-agent = "apply_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apply_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
